<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="main-container">

        <div id="signin">

            <h3>Sign in</h3>

            <form>

                <input
                    type="text"
                    name="email"
                    id="email"
                    placeholder="Email or phone number"
                    class="size"
                >

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    class="size"
                >

                <button class="signin-btn">
                    Sign in
                </button>

                <p class="or">OR</p>

                <button class="code-btn">
                    Use a sign-in code
                </button>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <div class="remember">
                    <input type="checkbox" name="remember" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <p>
                    <span class="gray">New to Netflix?</span>
                    Sign up Now
                </p>

                <small>
                    ! It can be harmful if overused, affecting studies,
                    health, and daily life.
                </small>

            </form>

        </div>

    </div>

</body>

</html>
