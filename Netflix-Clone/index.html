<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Netflix Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="main-container">

        <div id="signin">

            <h1>Sign in</h1>

            <form>

                <label for="email">Email or phone number</label>

                <input
                    type="text"
                    name="email"
                    id="email"
                    placeholder="Email or phone number"
                    class="size"
                >

                <label for="password">Password</label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Password"
                    class="size"
                >

                <button
                    type="submit"
                    class="signin-btn">
                    Sign in
                </button>

                <p class="or">OR</p>

                <button
                    type="button"
                    class="code-btn">
                    Use a sign-in code
                </button>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <div class="remember">

                    <input
                        type="checkbox"
                        name="remember"
                        id="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <p class="signup">
                    <span class="gray">
                        New to Netflix?
                    </span>

                    <a href="#">
                        Sign up Now
                    </a>
                </p>

                <small>
                    This page is protected by Google reCAPTCHA
                    to ensure you're not a bot.
                </small>

            </form>

        </div>

    </div>

</body>

</html>
